[project]
name = "marketplace-generators"
version = "0.1.0"
description = "Albert's Marketplace generators: calibration, order history and live traffic"
requires-python = "==3.12.*"
dependencies = []

[dependency-groups]
# Build time: calibration, places and the order history (the build compose profile)
build = [
    "faker==40.18.0",
    "numpy==2.5.3",
    "pandas==3.0.5",
    "psycopg[binary]==3.3.5",
    "python-calamine==0.8.2",
]
# Live traffic: the load generator's image installs only this group
live = [
    "confluent-kafka==2.15.1",
    "psycopg[binary]==3.3.5",
    "requests==2.34.2",
]

[tool.uv]
package = false
default-groups = ["build", "live"]
